[package]
name = "openxiii-vm"
description = "UnrealScript virtual machine that runs the game code of XIII"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Mod support (docs/modding/README.md), enabled by the viewer's "mods" feature. Off by default and
# in the faithful release: without it, nothing of the mods code is compiled in.
mods = ["dep:openxiii-mods", "openxiii-assets/mods", "dep:mlua", "dep:serde_json"]
# Fixes of the improved build that go beyond the original game (halos and smoke depending on the
# angle, hint of an already broken box): never in the faithful build.
improved = ["openxiii-assets/runtime_textures"]

[dependencies]
openxiii-math = { path = "../openxiii-math" }
openxiii-package = { path = "../openxiii-package" }
openxiii-script = { path = "../openxiii-script" }
openxiii-assets = { path = "../openxiii-assets" }
openxiii-hx = { path = "../openxiii-hx" }
openxiii-mods = { path = "../openxiii-mods", optional = true }
# Mods build only: the mods' Lua scripts (Lua 5.4, built from its C sources with the crate).
mlua = { version = "0.11", features = ["lua54", "vendored"], optional = true }
# Mods build only: the scripts' memory (`save`), written as JSON.
serde_json = { version = "1", optional = true }
# Profiles (.pro): the C zlib, compress level 6 like the original byte for byte (miniz and
# zlib-rs compress differently).
flate2 = { version = "1.1.10", default-features = false, features = ["zlib"] }
chrono = "0.4.45"
