[mod]
name = "A killer's arms (green blouson)"
version = "1.0.0"
author = "OpenXIII"
description = "Arms of a co-op character: every weapon and object seen in first person is held with the bare hands and green blouson sleeves of one of the Mongoose's killers, made from the player's own game when it starts. Use it instead of the other arms mods, not with them."
openxiii = "0.1.0"

# Every first-person mesh of the game, drawn instead of the game's. The killer of Tueur5M in his
# first dress: a green blouson whose sleeves end in a gathered cuff; bare hands, the size of
# XIII's. Skin and cloth are measured on his model. The weapons and objects are unchanged. The
# same recipe as the FBI agent's blouson, with his colours.
[arms.Killer5]
from = ["XIIIArmes.*", "XIIIDeco.*"]
replace = true
skin_from = "XIIIPersos.Tueur5M"

[arms.Killer5.sleeve]
fabric_from = "XIIIPersos.Tueur5M"
cuff = 0.95
creases = true
ribs = [0.85, 10, 0.15]
rib_colour = [24, 36, 24]
relief_from = "XIIIPersos.Tueur5M"
thickness = 1.05
room = 0.15
lip = 1.03
taper = [0.75, 0.85]
folds = 0
