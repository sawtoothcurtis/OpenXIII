[mod]
name = "An FBI agent's arms"
version = "1.0.0"
author = "OpenXIII"
description = "Arms of a co-op character: every weapon and object seen in first person is held with the bare hands and navy jacket sleeves of an FBI agent, made from the player's own game when it starts. Use it instead of the other arms mods, not with them."
openxiii = "0.1.0"

# Every first-person mesh of the game, drawn instead of the game's. On his model the FBI agent
# wears a navy blouson whose sleeves end at the wrist in a gathered cuff; his hands are bare, the
# size of XIII's. Skin and cloth are measured on his model. The weapons and objects themselves are
# unchanged.
[arms.FBI]
from = ["XIIIArmes.*", "XIIIDeco.*"]
replace = true
skin_from = "XIIIPersos.FbiM"

# The sleeve: straight and fitted, plain navy, narrowing into the gathered cuff (its gathers drawn
# as short darker lines along the arm), two thin crease lines and a small lip at the cuff.
[arms.FBI.sleeve]
fabric_from = "XIIIPersos.FbiM"
cuff = 0.95
creases = true
ribs = [0.85, 10, 0.15]
rib_colour = [20, 29, 44]
relief_from = "XIIIPersos.FbiM"
thickness = 1.05
room = 0.15
lip = 1.03
taper = [0.75, 0.85]
folds = 0
