[mod]
name = "A killer's arms (long coat)"
version = "1.0.0"
author = "OpenXIII"
description = "Arms of a co-op character: every weapon and object seen in first person is held with the bare hands and long coat sleeves of one of the Mongoose's killers, made from the player's own game when it starts. Use it instead of the other arms mods, not with them."
openxiii = "0.1.0"

# Every first-person mesh of the game, drawn instead of the game's. The killer of Tueur1M in his
# first dress: a long brown coat whose sleeves end at the wrist with a buckled strap; bare hands,
# the size of XIII's. Skin and cloth are measured on his model. The weapons and objects are
# unchanged.
[arms.Killer1]
from = ["XIIIArmes.*", "XIIIDeco.*"]
replace = true
skin_from = "XIIIPersos.Tueur1M"

# The sleeve: straight and fitted, plain brown, the strap across it outlined in ink, two thin
# crease lines and a small lip.
[arms.Killer1.sleeve]
fabric_from = "XIIIPersos.Tueur1M"
cuff = 0.96
creases = true
tab = [0.7, 0.86, 1.15, 0.22]
relief_from = "XIIIPersos.Tueur1M"
thickness = 1.05
room = 0.15
lip = 1.05
folds = 0
