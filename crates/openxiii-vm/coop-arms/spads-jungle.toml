[mod]
name = "A SPADS soldier's arms (jungle)"
version = "1.0.0"
author = "OpenXIII"
description = "Arms of a co-op character: every weapon and object seen in first person is held with the bare hands and camouflage sleeves of a SPADS soldier in jungle dress, made from the player's own game when it starts. Use it instead of the other arms mods, not with them."
openxiii = "0.1.0"

# Every first-person mesh of the game, drawn instead of the game's. A SPADS soldier in his second
# jungle dress (SpadsM with SpadsJungleSkin2TEX, as in SPADS02a/b and USA01): camouflage sleeves
# with a ribbed cuff, and bare hands, the size of XIII's. Skin and cloth are measured on that skin,
# and the sleeve in relief is drawn with that skin's own camouflage (its lit half, mirrored all
# around the sleeve: the painted shadow of the underside left out). The weapons and objects are
# unchanged.
[arms.SpadsJungle]
from = ["XIIIArmes.*", "XIIIDeco.*"]
replace = true
skin_from = "XIIIPersos.SpadsM@XIIIPersos.Skins.SpadsJungleSkin2TEX"

[arms.SpadsJungle.sleeve]
fabric_from = "XIIIPersos.SpadsM@XIIIPersos.Skins.SpadsJungleSkin2TEX"
cuff = 0.95
relief_from = "XIIIPersos.SpadsM@XIIIPersos.Skins.SpadsJungleSkin2TEX"
relief_texture = "model"
thickness = 1.05
room = 0.15
lip = 1.03
taper = [0.75, 0.85]
folds = 0
