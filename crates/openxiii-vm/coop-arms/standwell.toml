[mod]
name = "General Standwell's arms"
version = "1.0.0"
author = "OpenXIII"
description = "Arms of a co-op character: every weapon and object seen in first person is held with General Standwell's bare hands in the navy sleeves of his uniform, made from the player's own game when it starts. Use it instead of the other arms mods, not with them."
openxiii = "0.1.0"

# Every first-person mesh of the game, drawn instead of the game's. General Standwell in his
# general's uniform (StandwellM, as in Hual02, Sanc01, SPADS01, SPADS02a and SSH101b): a navy
# sleeve, the white cuff of his shirt showing at the wrist and three buttons; his hands are bare,
# the size of XIII's. Skin and cloth are measured on his model. The weapons and objects are
# unchanged. The same recipe as Sheridan's suit, with his colours.
[arms.Standwell]
from = ["XIIIArmes.*", "XIIIDeco.*"]
replace = true
skin_from = "XIIIPersos.StandwellM"

[arms.Standwell.sleeve]
fabric = [41, 65, 90]
cuff = 0.96
band = [247, 251, 247]
band_width = 0.05
creases = true
buttons = [0.87, 3, 1.15, 0.045]
button_colour = [21, 32, 43]
relief_from = "XIIIPersos.StandwellM"
thickness = 1.05
room = 0.15
lip = 1.03
folds = 0
