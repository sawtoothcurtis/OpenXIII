[mod]
name = "General Standwell's arms (conspirator's robe)"
version = "1.0.0"
author = "OpenXIII"
description = "Arms of a co-op character: every weapon and object seen in first person is held with General Standwell's bare hands in the sleeves of his conspirator's robe, made from the player's own game when it starts. Use it instead of the other arms mods, not with them."
openxiii = "0.1.0"

# Every first-person mesh of the game, drawn instead of the game's. General Standwell in the robe of
# the conspirators (StandKM, in Sanc02a): a long cream robe whose sleeves are wide wings hanging
# under the arms, cream outside, purple inside, edged in purple; his hands are bare, the size of
# XIII's. Skin and cloth are measured on his model. The same recipe as the hooded conspirator's.
[arms.StandwellRobe]
from = ["XIIIArmes.*", "XIIIDeco.*"]
replace = true
skin_from = "XIIIPersos.StandKM"

# The sleeve: cream, edged in purple at the cuff. The wing hanging under his arm is left out: it
# would hang below the screen in first person (it shows on his body).
[arms.StandwellRobe.sleeve]
fabric_from = "XIIIPersos.StandKM"
cuff = 0.95
band = [66, 22, 66]
band_width = 0.06
relief_from = "XIIIPersos.StandKM"
thickness = 1.05
room = 0.15
lip = 1.05
folds = 0
