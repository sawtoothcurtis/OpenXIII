[mod]
name = "Sheridan's arms (grey suit)"
version = "1.0.0"
author = "OpenXIII"
description = "Arms of a co-op character: every weapon and object seen in first person is held with Walter Sheridan's hands in the sleeves of his grey suit, made from the player's own game when it starts. Use it instead of the other arms mods, not with them."
openxiii = "0.1.0"

# Every first-person mesh of the game, drawn instead of the game's. Sheridan in the grey suit of his
# model (SheridanTex, as in SMarin01 and the SSH1 levels): a grey sleeve, the light blue cuff of his
# shirt showing at the wrist and three black buttons; his hands are bare, the size of XIII's. Skin
# and cloth are measured on his model. The weapons and objects are unchanged.
[arms.SheridanGrey]
from = ["XIIIArmes.*", "XIIIDeco.*"]
replace = true
skin_from = "XIIIPersos.SheridanM"

# The sleeve: straight and fitted, grey (its colour measured on the jacket, without the shirt's
# cuff), the shirt's light blue cuff as a band at its edge, three black buttons, two thin crease
# lines and a small lip.
[arms.SheridanGrey.sleeve]
fabric = [90, 89, 90]
cuff = 0.96
band = [99, 138, 156]
band_width = 0.05
creases = true
buttons = [0.87, 3, 1.15, 0.045]
button_colour = [8, 10, 8]
relief_from = "XIIIPersos.SheridanM"
thickness = 1.05
room = 0.15
lip = 1.03
folds = 0
