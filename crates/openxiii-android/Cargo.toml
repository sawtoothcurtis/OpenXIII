[package]
name = "openxiii-android"
description = "OpenXIII for Android: the oxiii-view game as a library (android_main), for the APK"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

# Outside the PC workspace (exclude in ../../Cargo.toml): Android only.
# The library root is oxiii-view's main.rs, so that the game is the same as on PC;
# android_main is in openxiii-viewer/src/android.rs (cfg(target_os = "android")).
[workspace]

[lib]
name = "openxiii"
crate-type = ["cdylib"]
path = "../openxiii-viewer/src/main.rs"

[features]
# Cheats of the test builds (Select level menu, test weapons, god mode, infinite ammo,
# speed x2/x3; aim assist is a setting of both builds), off by default: `--features cheats`
# turns them on. Without it, the game is the original's, without any cheat.
default = []
cheats = []
# Improved build (fixes beyond the original game): without it, the faithful build.
improved = ["openxiii-vm/improved", "mods"]
dx11 = []
# Mod support (docs/modding/README.md), part of the improved build as on PC.
mods = ["dep:openxiii-mods", "openxiii-vm/mods"]

[dependencies]
openxiii-package = { path = "../openxiii-package" }
openxiii-assets = { path = "../openxiii-assets" }
openxiii-vm = { path = "../openxiii-vm" }
openxiii-hx = { path = "../openxiii-hx" }
openxiii-script = { path = "../openxiii-script" }
openxiii-math = { path = "../openxiii-math" }
openxiii-mods = { path = "../openxiii-mods", optional = true }
wgpu = "30"
winit = { version = "0.30", features = ["android-game-activity"] }
pollster = "1"
bytemuck = { version = "1", features = ["derive"] }
png = "0.17"
rodio = { version = "=0.20.1", default-features = false }
gilrs = "0.11"
rustc-hash = "2"
log = "0.4"

[profile.release]
debug = "line-tables-only"

# Same patched wgpu-hal as the PC (../../Cargo.toml): this package has its own workspace.
[patch.crates-io]
wgpu-hal = { path = "../../vendor/wgpu-hal" }
