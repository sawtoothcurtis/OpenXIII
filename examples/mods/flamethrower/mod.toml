[mod]
name = "Flamethrower"
version = "1.0.0"
author = "OpenXIII"
description = "A flamethrower in hand on every level. Characters caught in its flame catch fire and burn black; what it touches is marked and blackened; wood catches fire and blazes spread, smoke and roar, and a building that burns down blows out. The weapon is a mod.toml class; everything else is a Lua script (scripts/flamethrower.lua) using the mods' script functions."
openxiii = "0.1.0"

# Load the jet, fire loops and building blast sounds on playable maps. In particular, the
# first explosion would otherwise load the large defaultmulti bank in the middle of a frame.
[map.solo]
load_sound_banks = ["SSH102b", "SPADS02b", "Sanc02b", "Kello01b", "defaultmulti"]

[map.multi]
load_sound_banks = ["SSH102b", "SPADS02b", "Sanc02b", "Kello01b", "defaultmulti"]

# Its own files: its models (made with Blender by ../make-flamethrower-model-v2.py: the steel lance
# held in the hands, and the tanks worn on the back) and its icon.
[models.FlamethrowerTube]
file = "models/flamethrower-lance.gltf"

[models.FlamethrowerTanks]
file = "models/flamethrower-tanks.gltf"

# The HUD icon is kept as it is: a picture rendered once with Blender from the first model of the
# weapon (no script makes it again).
[textures.FlamethrowerIcon]
file = "textures/flamethrower-icon.png"

# The weapon, its pickup, the gun seen in a character's hand and its fuel. The mini Uzi gives
# the fire button held down (WM_Auto): fuel goes while the button is held.
[classes.Flamethrower]
parent = "XIII.MiniUzi"

[classes.FlamethrowerPick]
parent = "XIII.MiniUziPick"

[classes.FlamethrowerAttach]
parent = "XIII.MiniUziAttach"

[classes.FlamethrowerFuel]
parent = "XIII.MiniUziAmmo"

[class."Mod.Flamethrower"]
ItemName = "Flamethrower"
AmmoName = "Mod.FlamethrowerFuel"
PickupClassName = "Mod.FlamethrowerPick"
AttachmentClass = "Mod.FlamethrowerAttach"
HudIcon = "Mod.FlamethrowerIcon"
ReloadCount = 100         # fuel used before refilling (one unit per shot of the mini Uzi's pace)
PickupAmmoCount = 300
TraceDist = 650           # its "bullets" stop where the flame stops (the game: 10000 or more)
TraceAccuracy = 3.0
bDrawMuzzleFlash = false  # no gun flash: the flame is the script's
ViewFeedBack = { X = 0.0, Y = 0.0 }   # the view does not kick
hFireSound = "None"       # no firing sound yet (the mini Uzi's shot is not kept)
hAltFireSound = "None"
# Held level in both hands in third person, as the M16 (the mini Uzi it comes from hangs at
# arm's length): the lance seen by the other players points where the flame goes.
FiringMode = "FM_M16"
ThirdPersonRelativeRotation = { Pitch = 7000 }

# In first person: the 9mm's hands, its gun hidden, the flamethrower held instead. The firing animation
# is the waiting one: the hands stay still while the flame comes out.
FirstPersonFrom = "XIII.Beretta"
FirstPersonAnimations = { Fire = "Wait", FireLast = "Wait" }
FirstPersonModel = "Mod.FlamethrowerTube"
FirstPersonModelBone = "Berretta"
FirstPersonHideBones = ["Berretta", "chargeur", "percuteur"]
FirstPersonModelScale = 0.3
# Turned a little towards the middle of the screen, so that its side (valve, grips, hose) is seen.
FirstPersonModelRotation = { Pitch = 400, Yaw = -2000 }
FirstPersonModelOffset = { X = 2.0 }
PlayerViewOffset = { Z = -3.3 }

[class."Mod.FlamethrowerFuel"]
ItemName = "Fuel"
MaxAmmo = 600
SRDamages = 0             # the "bullets" hurt nobody: the script's flame burns
LRDamages = 0
fTraceFrequency = 0.0     # no tracer
ImpactEffectsBySurface = false
ImpactEmitterMem = "None"
DecalProjectorClass = "None"

[class."Mod.FlamethrowerPick"]
InventoryType = "Mod.Flamethrower"
PickupMessage = "Flamethrower"
StaticMesh = "Mod.FlamethrowerTube"

[class."Mod.FlamethrowerAttach"]
WeaponClass = "Mod.Flamethrower"
hFireSound = "None"
StaticMeshName = "Mod.FlamethrowerTube"
DrawScale = 3.0

# ---------------------------------------------------------------------------------------------
# The effects. All three are made from XIDCine.XIIIFireTorchEmitter, the game's "human torch"
# (a fire emitter with its "aahh" word), each with its own values.

# The jet: fast flame sprites (XIIICine.effets.flammeperso, the texture of the burning man of
# Toits01) shot where the emitter faces, slowing down, rising and growing; they stop at walls.
# The script turns it on while the fire button is held.
[classes.FlameJet]
parent = "XIDCine.XIIIFireTorchEmitter"

[class."Mod.FlameJet"]
# No light: it is there as long as the weapon is in hand (its flames off), and the game's light
# of an actor falls on the movers only (doors, shutters), not on the level's walls.
bDynamicLight = false
LightType = "LT_None"
"Emitters[0]" = { Texture = "XIIICine.effets.flammeperso", MaxParticles = 130, UseRotationFrom = "PTRS_Actor", StartLocationRange = { X = { Min = 0.0, Max = 10.0 }, Y = { Min = -2.0, Max = 2.0 }, Z = { Min = -2.0, Max = 2.0 } }, StartVelocityRange = { X = { Min = 1150.0, Max = 1350.0 }, Y = { Min = -60.0, Max = 60.0 }, Z = { Min = -30.0, Max = 60.0 } }, VelocityLossRange = { X = { Min = 0.6, Max = 0.9 }, Y = { Min = 0.6, Max = 0.9 }, Z = { Min = 0.3, Max = 0.6 } }, Acceleration = { Z = 160.0 }, LifetimeRange = { Min = 0.55, Max = 0.7 }, StartSizeRange = { X = { Min = 10.0, Max = 16.0 }, Y = { Min = 10.0, Max = 16.0 }, Z = { Min = 10.0, Max = 16.0 } }, UniformSize = true, UseSizeScale = true, UseRegularSizeScale = false, SizeScale = [{ RelativeTime = 0.0, RelativeSize = 0.5 }, { RelativeTime = 0.3, RelativeSize = 2.4 }, { RelativeTime = 1.0, RelativeSize = 4.4 }], FadeOut = true, FadeOutStartTime = 0.3, UseCollision = true, DampingFactorRange = { X = { Min = 0.2, Max = 0.3 }, Y = { Min = 0.2, Max = 0.3 }, Z = { Min = 0.2, Max = 0.3 } }, SecondsBeforeInactive = 0.0 }
# Its bright core: smaller, faster, shorter flames of the torch's own fire texture.
"Emitters[1]" = { Texture = "XIIICine.effets.Explosion", DrawStyle = "PTDS_Brighten", ColorScale = [{ RelativeTime = 0.0, Color = { R = 255, G = 200, B = 120 } }, { RelativeTime = 1.0, Color = { R = 160, G = 70, B = 20 } }], UseColorScale = true, MaxParticles = 60, ParticlesPerSecond = 0.0, InitialParticlesPerSecond = 0.0, AutomaticInitialSpawning = true, UseRotationFrom = "PTRS_Actor", StartLocationRange = { X = { Min = 0.0, Max = 6.0 }, Y = { Min = -1.0, Max = 1.0 }, Z = { Min = -1.0, Max = 1.0 } }, StartVelocityRange = { X = { Min = 1400.0, Max = 1600.0 }, Y = { Min = -30.0, Max = 30.0 }, Z = { Min = -20.0, Max = 30.0 } }, VelocityLossRange = { X = { Min = 1.0, Max = 1.5 }, Y = { Min = 1.0, Max = 1.5 }, Z = { Min = 0.5, Max = 1.0 } }, LifetimeRange = { Min = 0.3, Max = 0.42 }, StartSizeRange = { X = { Min = 6.0, Max = 9.0 }, Y = { Min = 5.0, Max = 8.0 }, Z = { Min = 5.0, Max = 8.0 } }, UniformSize = true, UseSizeScale = true, UseRegularSizeScale = false, SizeScale = [{ RelativeTime = 0.0, RelativeSize = 0.5 }, { RelativeTime = 1.0, RelativeSize = 3.0 }], FadeOut = true, FadeOutStartTime = 0.15, UseCollision = true, DampingFactorRange = { X = { Min = 0.2, Max = 0.3 }, Y = { Min = 0.2, Max = 0.3 }, Z = { Min = 0.2, Max = 0.3 } }, SecondsBeforeInactive = 0.0 }

# The pilot flame at the nozzle while the weapon is in hand: a few small, short flames.
[classes.PilotFlame]
parent = "XIDCine.XIIIFireTorchEmitter"

[class."Mod.PilotFlame"]
bDynamicLight = false
LightType = "LT_None"
"Emitters[0]" = { Texture = "XIIICine.effets.flammeperso", MaxParticles = 8, UseRotationFrom = "PTRS_Actor", StartLocationRange = { X = { Min = 0.0, Max = 1.0 }, Y = { Min = -0.5, Max = 0.5 }, Z = { Min = -0.5, Max = 0.5 } }, StartVelocityRange = { X = { Min = 10.0, Max = 20.0 }, Y = { Min = -2.0, Max = 2.0 }, Z = { Min = 4.0, Max = 10.0 } }, LifetimeRange = { Min = 0.18, Max = 0.28 }, StartSizeRange = { X = { Min = 2.0, Max = 3.0 }, Y = { Min = 2.0, Max = 3.0 }, Z = { Min = 2.0, Max = 3.0 } }, UniformSize = true, SizeScale = [{ RelativeTime = 0.0, RelativeSize = 1.0 }, { RelativeTime = 1.0, RelativeSize = 0.4 }], SecondsBeforeInactive = 0.0 }

