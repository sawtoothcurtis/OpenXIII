# The mark of the flames on walls and floors: the black blast mark of a grenade (XIII.GrenadBlast,
# texture XIIICine.effets.BulletImpact3), staying two minutes.
[classes.FlameScorch]
parent = "XIII.GrenadBlast"

[class."Mod.FlameScorch"]
DrawScale = 2.0           # grenade: 2
Lifetime = 120            # seconds (grenade: 6)
bProjectActor = true      # also on static meshes, movers and objects (a pier, crates)
bProjectTerrain = true    # and on the ground of outdoor levels (grenade: neither)

# Where a fire is left burning: a wider mark, staying three minutes.
[classes.FireScorch]
parent = "XIII.GrenadBlast"

[class."Mod.FireScorch"]
DrawScale = 2.6
Lifetime = 180
bProjectActor = true
bProjectTerrain = true

# A wide burn mark a blaze leaves on the level's own walls, floors and ceilings (the grenade's
# blast mark, bigger), staying as long as the level.
[classes.CharredSurface]
parent = "XIII.GrenadBlast"

[class."Mod.CharredSurface"]
DrawScale = 4.5
MaxTraceDistance = 60
bProjectActor = false
bProjectTerrain = true

